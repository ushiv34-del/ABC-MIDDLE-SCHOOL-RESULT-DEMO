services:
  - type: web
    name: abc-middle-result-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: RESULT_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "true"
